<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a0a0c">
<title>Cardápio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#ff3c3c;
  --bg:#080808;--panel:#111115;--card:#16161a;--border:#222228;
  --text:#f0f0f5;--muted:#555568;--muted2:#8888a0;
  --gold:#f0b429;--green:#00e096;
  --font:'DM Sans',sans-serif;--display:'Bebas Neue',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);font-family:var(--font);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
/* LOADING */
#loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.spinner{width:34px;height:34px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:.82rem;color:var(--muted2);}
/* ERROR */
#error-screen{min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;gap:14px;}
.err-icon{font-size:3rem;opacity:.45;}
.err-title{font-size:1.2rem;font-weight:700;}
.err-sub{font-size:.85rem;color:var(--muted2);max-width:280px;line-height:1.6;}
/* MENU */
#menu-content{display:none;}
/* HEADER */
.menu-header{text-align:center;padding:36px 20px 22px;position:relative;overflow:hidden;}
.menu-header::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:300px;height:200px;background:radial-gradient(ellipse,rgba(255,60,60,.18),transparent 70%);pointer-events:none;}
.logo-ring{width:72px;height:72px;margin:0 auto 14px;background:radial-gradient(circle at 35% 35%,#2a0000,#080808);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 32px rgba(255,60,60,.25);border:1px solid rgba(255,60,60,.2);overflow:hidden;font-size:2rem;transition:border-color .3s;}
.logo-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.menu-nome{font-family:var(--display);font-size:2.2rem;letter-spacing:5px;color:var(--text);margin-bottom:4px;line-height:1;}
.menu-desc{font-size:.85rem;color:var(--muted2);margin-bottom:14px;line-height:1.5;}
.menu-info-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.info-pill{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--border);font-size:.74rem;color:var(--muted2);}
.info-pill a{color:inherit;text-decoration:none;}
.info-pill a:hover{color:var(--text);}
/* HORÁRIO */
.horario-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:.74rem;font-weight:700;margin-bottom:4px;}
.hb-open{background:rgba(0,224,150,.1);border:1px solid rgba(0,224,150,.25);color:var(--green);}
.hb-closed{background:rgba(255,60,60,.08);border:1px solid rgba(255,60,60,.2);color:var(--accent);}
.hb-dot{width:6px;height:6px;border-radius:50%;}
.hb-open .hb-dot{background:var(--green);animation:pulse 1.5s ease-in-out infinite;}
.hb-closed .hb-dot{background:var(--accent);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* NAV */
.cat-nav{position:sticky;top:0;z-index:50;background:rgba(8,8,8,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 16px;overflow-x:auto;display:flex;gap:4px;scrollbar-width:none;}
.cat-nav::-webkit-scrollbar{display:none;}
.cat-nav-btn{padding:12px 14px;border:none;background:none;color:var(--muted2);font-family:var(--font);font-size:.8rem;font-weight:700;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;letter-spacing:.4px;transition:all .2s;flex-shrink:0;}
.cat-nav-btn:hover{color:var(--text);}
.cat-nav-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
/* SECTIONS */
.menu-section{padding:0 16px;margin-bottom:8px;}
.sec-title{font-family:var(--display);font-size:1.4rem;letter-spacing:3px;color:var(--text);padding:20px 0 12px;display:flex;align-items:center;gap:12px;}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);}
/* ITEM */
.item-card{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;position:relative;overflow:hidden;transition:border-color .2s,transform .15s;cursor:pointer;}
.item-card:active{transform:scale(.99);}
.item-card.inativo{opacity:.5;pointer-events:none;}
.item-card.destaque{border-color:rgba(240,180,41,.2);}
.item-card.in-cart{border-color:rgba(0,224,150,.3);background:rgba(0,224,150,.03);}
.item-img{width:80px;height:80px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--panel);}
.item-img-ph{width:80px;height:80px;border-radius:10px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0;}
.item-info{flex:1;min-width:0;}
.item-nome{font-size:.95rem;font-weight:700;margin-bottom:4px;line-height:1.3;}
.item-desc{font-size:.78rem;color:var(--muted2);line-height:1.5;margin-bottom:8px;}
.item-serve{font-size:.72rem;color:var(--muted);margin-top:2px;}
.item-bottom{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.item-preco{font-size:1.1rem;font-weight:900;color:var(--text);letter-spacing:-.5px;}
.item-preco::before{content:'R$ ';font-size:.8rem;font-weight:400;color:var(--muted2);}
.item-badges{display:flex;gap:5px;flex-wrap:wrap;}
.i-badge{padding:2px 8px;border-radius:5px;font-size:.63rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.ib-novo{background:rgba(240,180,41,.12);color:var(--gold);border:1px solid rgba(240,180,41,.25);}
.ib-dest{background:rgba(255,60,60,.08);color:var(--accent);border:1px solid rgba(255,60,60,.2);}
.ib-esgo{background:rgba(107,107,122,.1);color:var(--muted2);border:1px solid rgba(107,107,122,.2);}
.dest-stripe{position:absolute;top:0;right:0;width:3px;height:100%;background:linear-gradient(180deg,var(--gold),transparent);}
/* CARRINHO QTY no card */
.item-qty-ctrl{display:flex;align-items:center;gap:6px;margin-left:auto;}
.iq-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.iq-btn:hover{border-color:var(--accent);color:var(--accent);}
.iq-num{font-family:'DM Mono',monospace;font-size:.88rem;font-weight:700;min-width:16px;text-align:center;color:var(--green);}
/* ENTREGA FOOTER */
.entrega-footer{margin:16px;padding:16px;background:var(--panel);border:1px solid var(--border);border-radius:14px;}
.ef-title{font-size:.7rem;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:12px;}
.ef-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ef-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;font-size:.78rem;}
.ef-bairro{color:var(--muted2);}
.ef-taxa{font-weight:700;color:var(--text);}
/* FLOATING CART BUTTON */
.cart-fab{
  position:fixed;bottom:24px;right:16px;z-index:100;
  background:var(--accent);color:#fff;border:none;border-radius:50px;
  padding:13px 22px;font-family:var(--font);font-size:.88rem;font-weight:800;
  cursor:pointer;display:none;align-items:center;gap:10px;
  box-shadow:0 8px 32px rgba(255,60,60,.35);transition:all .2s;
  letter-spacing:.3px;
}
.cart-fab:hover{background:#ff5252;transform:scale(1.03);}
.cart-fab:active{transform:scale(.97);}
.cart-fab.visible{display:flex;}
.cart-fab .cf-badge{background:rgba(0,0,0,.3);border-radius:20px;padding:2px 9px;font-size:.8rem;font-weight:900;}
/* CART DRAWER */
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:200;display:none;}
.cart-overlay.open{display:block;}
.cart-drawer{
  position:fixed;bottom:0;left:0;right:0;z-index:201;
  background:var(--panel);border-top:1px solid var(--border);
  border-radius:20px 20px 0 0;
  max-height:90vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s ease;
}
.cart-drawer.open{transform:translateY(0);}
.cd-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0;}
.cd-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;border-bottom:1px solid var(--border);}
.cd-title{font-size:1rem;font-weight:800;}
.cd-close{background:none;border:none;color:var(--muted2);font-size:1.2rem;cursor:pointer;padding:4px;}
.cd-clear{background:none;border:none;color:var(--muted);font-size:.76rem;font-weight:700;cursor:pointer;font-family:var(--font);}
.cd-clear:hover{color:var(--accent);}
.cd-body{flex:1;overflow-y:auto;padding:16px 20px;}
.cd-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.cd-item:last-child{border-bottom:none;}
.cdi-name{flex:1;font-size:.88rem;font-weight:600;}
.cdi-price{font-size:.82rem;color:var(--muted2);margin-top:2px;}
.cdi-ctrl{display:flex;align-items:center;gap:8px;}
.cdi-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.cdi-btn:hover{border-color:var(--accent);color:var(--accent);}
.cdi-qty{font-family:'DM Mono',monospace;font-size:.9rem;font-weight:700;min-width:20px;text-align:center;}
.cd-footer{padding:16px 20px;border-top:1px solid var(--border);}
.cd-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cd-total-lbl{font-size:.85rem;color:var(--muted2);font-weight:700;}
.cd-total-val{font-size:1.3rem;font-weight:900;color:var(--gold);}
/* FORM PEDIDO */
.cd-form{display:flex;flex-direction:column;gap:10px;}
.cd-input{width:100%;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font);font-size:.88rem;outline:none;transition:border-color .15s;}
.cd-input:focus{border-color:var(--accent);}
.cd-input::placeholder{color:var(--muted);}
.cd-input.error{border-color:var(--accent);}
.cd-label{font-size:.68rem;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;display:block;}
.loja-fechada-warn{padding:10px 14px;background:rgba(255,60,60,.08);border:1px solid rgba(255,60,60,.2);border-radius:10px;font-size:.8rem;color:var(--accent);text-align:center;}
.btn-confirmar{width:100%;padding:15px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-family:var(--font);font-size:.9rem;font-weight:800;cursor:pointer;letter-spacing:.5px;transition:all .14s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-confirmar:hover{background:#ff5252;} .btn-confirmar:active{transform:scale(.98);} .btn-confirmar:disabled{opacity:.5;cursor:not-allowed;}
/* SUCESSO */
.success-panel{display:none;flex-direction:column;align-items:center;gap:14px;padding:20px;text-align:center;}
.success-panel.show{display:flex;}
.sp-icon{font-size:2.8rem;}
.sp-title{font-size:1.1rem;font-weight:700;}
.sp-sub{font-size:.82rem;color:var(--muted2);line-height:1.6;}
.btn-wpp{padding:13px 24px;background:var(--green);border:none;border-radius:12px;color:#000;font-family:var(--font);font-size:.9rem;font-weight:800;cursor:pointer;transition:all .14s;display:flex;align-items:center;gap:8px;}
.btn-wpp:hover{opacity:.9;}
.btn-mais{background:none;border:none;color:var(--muted2);font-family:var(--font);font-size:.82rem;cursor:pointer;text-decoration:underline;}
/* BOTTOM CONTACTS */
.contact-bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px 18px;background:rgba(8,8,8,.95);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:none;gap:10px;z-index:50;}
.contact-bar.visible{display:flex;}
.cb-btn{flex:1;padding:12px;border-radius:12px;border:none;cursor:pointer;font-family:var(--font);font-size:.82rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s;text-decoration:none;}
.cb-btn:active{transform:scale(.97);}
.cb-wpp{background:var(--green);color:#000;}
.cb-ig{background:var(--panel);border:1px solid var(--border);color:var(--text);}
.powered{text-align:center;padding:12px 16px 90px;font-size:.68rem;color:var(--muted);letter-spacing:1px;}
.powered span{color:var(--accent);}
/* ANIMAÇÃO */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.item-card{animation:fadeUp .3s ease both;}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Carregando cardápio…</div>
</div>

<div id="error-screen">
  <div class="err-icon">🔍</div>
  <div class="err-title">Cardápio não encontrado</div>
  <div class="err-sub" id="err-msg">Verifique o link ou entre em contato com o estabelecimento.</div>
</div>

<div id="menu-content">
  <!-- HEADER -->
  <div class="menu-header">
    <div class="logo-ring" id="logo-ring">🍽️</div>
    <div class="menu-nome" id="menu-nome">—</div>
    <div class="menu-desc" id="menu-desc"></div>
    <div id="horario-badge"></div>
    <div class="menu-info-row" id="info-row"></div>
  </div>

  <!-- NAV CATEGORIAS -->
  <div class="cat-nav" id="cat-nav"></div>

  <!-- CORPO DO CARDÁPIO -->
  <div id="menu-body"></div>

  <!-- ENTREGA -->
  <div id="entrega-block"></div>

  <div class="powered">CARDÁPIO DIGITAL POR <span>LABRIOLAG</span></div>
</div>

<!-- CARRINHO FAB -->
<button class="cart-fab" id="cart-fab">
  🛒 Ver pedido <span class="cf-badge" id="cart-count">0</span>
</button>

<!-- CART OVERLAY + DRAWER -->
<div class="cart-overlay" id="cart-overlay"></div>
<div class="cart-drawer" id="cart-drawer">
  <div class="cd-handle"></div>
  <div class="cd-header">
    <div class="cd-title">🛒 Meu Pedido</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="cd-clear" onclick="limparCarrinho()">Limpar</button>
      <button class="cd-close" onclick="fecharCarrinho()">✕</button>
    </div>
  </div>

  <!-- Lista de itens -->
  <div class="cd-body" id="cd-body"></div>

  <!-- Footer com form -->
  <div class="cd-footer">
    <div class="cd-total">
      <span class="cd-total-lbl">Total</span>
      <span class="cd-total-val" id="cd-total">R$ 0,00</span>
    </div>
    <div class="cd-form" id="cd-form">
      <div id="loja-fechada-warn" style="display:none" class="loja-fechada-warn">🔒 A loja está fechada no momento.</div>
      <div>
        <label class="cd-label">Seu nome ou número da mesa / comanda *</label>
        <input class="cd-input" id="cd-ident" placeholder="Ex: João ou Mesa 5" maxlength="60">
      </div>
      <div>
        <label class="cd-label">Observações (opcional)</label>
        <input class="cd-input" id="cd-obs" placeholder="Ex: sem cebola, ponto da carne…" maxlength="200">
      </div>
      <button class="btn-confirmar" id="btn-confirmar">✅ Confirmar Pedido</button>
    </div>
    <!-- Painel de sucesso -->
    <div class="success-panel" id="success-panel">
      <div class="sp-icon">🎉</div>
      <div class="sp-title">Pedido enviado!</div>
      <div class="sp-sub">Seu pedido foi registrado. Clique abaixo para confirmar pelo WhatsApp.</div>
      <button class="btn-wpp" id="btn-wpp">💬 Confirmar pelo WhatsApp</button>
      <button class="btn-mais" onclick="resetarPedido()">Fazer mais pedidos</button>
    </div>
  </div>
</div>

<!-- BOTTOM BAR CONTATOS -->
<div class="contact-bar" id="contact-bar"></div>

<script>
// ════════════════════════════════════════════════════════
const API = 'https://menu.lab-wokerlabcore.workers.dev';
// ════════════════════════════════════════════════════════

// ── ESTADO ────────────────────────────────────────────
let CARDAPIO = null;
let CARRINHO = {}; // { itemKey: { nome, preco, qty } }
let PEDIDO_ID = null;
let WPP_TEL = '';

// ── BOOT ──────────────────────────────────────────────
(async () => {
  const params = new URLSearchParams(location.search);
  let slug = params.get('id') || params.get('slug') || '';
  const parts = location.pathname.split('/');
  const mi = parts.indexOf('menu');
  if(!slug && mi !== -1 && parts[mi+1]) slug = parts[mi+1];
  // suporte a /Menu/menu?id=slug (GitHub Pages sem subpath)
  if(!slug) slug = params.get('id') || '';

  if(!slug){ mostrarErro('Nenhum cardápio especificado na URL.'); return; }

  try{
    const r = await fetch(`${API}/menu/${encodeURIComponent(slug)}`);
    if(!r.ok){
      const d = await r.json().catch(()=>({}));
      throw new Error(d.error || `HTTP ${r.status}`);
    }
    CARDAPIO = await r.json();
    renderMenu(CARDAPIO);

    // polling 30s — atualizações em tempo real
    setInterval(async()=>{
      try{
        const rr = await fetch(`${API}/menu/${encodeURIComponent(slug)}`);
        if(rr.ok){ CARDAPIO = await rr.json(); renderMenu(CARDAPIO, true); }
      }catch(e){}
    }, 30000);
  }catch(e){ mostrarErro(e.message); }
})();

// ── RENDER MENU ───────────────────────────────────────
function renderMenu(data, atualizar=false){
  if(!atualizar){
    document.getElementById('loading').style.display='none';
    document.getElementById('menu-content').style.display='block';
  }
  document.title = data.nomeLoja || 'Cardápio';
  const cor = data.corPrimaria || '#ff3c3c';
  document.documentElement.style.setProperty('--accent', cor);
  document.querySelector('meta[name="theme-color"]').content = cor;

  // Logo
  const ring = document.getElementById('logo-ring');
  if(data.logo) ring.innerHTML=`<img src="${esc(data.logo)}" alt="${esc(data.nomeLoja)}" onerror="this.parentElement.textContent='🍽️'">`;
  ring.style.boxShadow = `0 0 32px ${cor}44`;
  ring.style.borderColor = `${cor}33`;

  document.getElementById('menu-nome').textContent = data.nomeLoja||'';
  document.getElementById('menu-desc').textContent = data.descricao||'';

  renderHorario(data.horarios);

  const infoRow = document.getElementById('info-row');
  infoRow.innerHTML='';
  if(data.endereco)  infoRow.innerHTML+=`<div class="info-pill">📍 ${esc(data.endereco)}</div>`;
  if(data.instagram) infoRow.innerHTML+=`<div class="info-pill">📸 <a href="https://instagram.com/${esc(data.instagram.replace('@',''))}" target="_blank">${esc(data.instagram)}</a></div>`;

  // Nav
  const catNav = document.getElementById('cat-nav');
  catNav.innerHTML='';
  (data.categorias||[]).forEach((cat,i)=>{
    const btn=document.createElement('button');
    btn.className='cat-nav-btn'+(i===0?' active':'');
    btn.textContent=cat.nome;btn.dataset.target=`sec-${i}`;
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.cat-nav-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`sec-${i}`)?.scrollIntoView({behavior:'smooth',block:'start'});
    });
    catNav.appendChild(btn);
  });

  // Itens
  const body=document.getElementById('menu-body');
  body.innerHTML='';
  (data.categorias||[]).forEach((cat,i)=>{
    const sec=document.createElement('div');
    sec.className='menu-section';sec.id=`sec-${i}`;
    sec.innerHTML=`<div class="sec-title">${esc(cat.nome)}</div>`;
    (cat.itens||[]).forEach(item=>sec.appendChild(criarItemEl(item)));
    body.appendChild(sec);
  });

  // Entrega
  const entBlock=document.getElementById('entrega-block');
  entBlock.innerHTML='';
  const ent=data.entrega;
  if(ent?.ativa && ent.taxas?.length){
    const div=document.createElement('div');div.className='entrega-footer';
    div.innerHTML=`<div class="ef-title">🛵 Taxas de entrega</div><div class="ef-grid">${ent.taxas.map(t=>`<div class="ef-item"><span class="ef-bairro">${esc(t.bairro)}</span><span class="ef-taxa">R$ ${esc(t.taxa)}</span></div>`).join('')}</div>`;
    entBlock.appendChild(div);
  }

  // Contact bar
  const cb=document.getElementById('contact-bar');
  cb.innerHTML='';
  if(data.telefone||data.instagram){
    cb.classList.add('visible');
    if(data.telefone){
      const tel=data.telefone.replace(/\D/g,'');
      cb.innerHTML+=`<a class="cb-btn cb-wpp" href="https://wa.me/55${tel}" target="_blank">💬 WhatsApp</a>`;
    }
    if(data.instagram) cb.innerHTML+=`<a class="cb-btn cb-ig" href="https://instagram.com/${esc(data.instagram.replace('@',''))}" target="_blank">📸 Instagram</a>`;
  }

  setupObserver(data.categorias||[]);
}

function criarItemEl(item){
  const div=document.createElement('div');
  const classes=['item-card'];
  if(item.inativo) classes.push('inativo');
  if(item.destaque) classes.push('destaque');
  const key=item.nome+'__'+item.preco;
  if(CARRINHO[key]) classes.push('in-cart');
  div.className=classes.join(' ');

  const badges=[];
  if(item.novo)     badges.push(`<span class="i-badge ib-novo">NOVO</span>`);
  if(item.destaque) badges.push(`<span class="i-badge ib-dest">⭐ Destaque</span>`);
  if(item.inativo)  badges.push(`<span class="i-badge ib-esgo">Esgotado</span>`);

  const qty=CARRINHO[key]?.qty||0;
  const qtyCtrl=`<div class="item-qty-ctrl">
    ${qty>0?`<button class="iq-btn" onclick="alterarQty(event,'${esc(key)}','${esc(item.nome)}','${esc(item.preco)}',-1)">−</button>
    <span class="iq-num">${qty}</span>`:''}
    <button class="iq-btn" onclick="alterarQty(event,'${esc(key)}','${esc(item.nome)}','${esc(item.preco)}',1)" style="background:rgba(0,224,150,.12);border-color:rgba(0,224,150,.3);color:var(--green);">+</button>
  </div>`;

  div.innerHTML=`
    ${item.destaque?'<div class="dest-stripe"></div>':''}
    ${item.imagem
      ?`<img class="item-img" src="${esc(item.imagem)}" alt="${esc(item.nome)}" loading="lazy" onerror="this.outerHTML='<div class=item-img-ph>🍽️</div>'">`
      :`<div class="item-img-ph">🍽️</div>`}
    <div class="item-info">
      <div class="item-nome">${esc(item.nome||'')}</div>
      ${item.descricao?`<div class="item-desc">${esc(item.descricao)}</div>`:''}
      ${item.serve?`<div class="item-serve">Serve ${esc(item.serve)}</div>`:''}
      <div class="item-bottom">
        ${item.preco?`<div class="item-preco">${esc(item.preco)}</div>`:''}
        ${badges.length?`<div class="item-badges">${badges.join('')}</div>`:''}
        ${qtyCtrl}
      </div>
    </div>`;
  return div;
}

// ── CARRINHO ──────────────────────────────────────────
function alterarQty(e, key, nome, preco, delta){
  e.stopPropagation();
  const precoNum = parsePreco(preco);
  if(!CARRINHO[key]) CARRINHO[key]={nome, preco, precoNum, qty:0};
  CARRINHO[key].qty = Math.max(0, CARRINHO[key].qty+delta);
  if(CARRINHO[key].qty===0) delete CARRINHO[key];
  atualizarCarrinho();
  renderMenu(CARDAPIO, true); // re-render itens com qtys atualizados
}

function parsePreco(s){
  if(!s)return 0;
  return parseFloat(String(s).replace(/[^\d,\.]/g,'').replace(',','.').trim())||0;
}

function atualizarCarrinho(){
  const itens=Object.values(CARRINHO);
  const total=itens.reduce((s,i)=>s+i.precoNum*i.qty,0);
  const count=itens.reduce((s,i)=>s+i.qty,0);
  const fab=document.getElementById('cart-fab');
  document.getElementById('cart-count').textContent=count;
  if(count>0) fab.classList.add('visible'); else fab.classList.remove('visible');
  document.getElementById('cd-total').textContent=`R$ ${total.toFixed(2)}`;
  renderCDBody(itens);
}

function renderCDBody(itens){
  const b=document.getElementById('cd-body');
  if(!itens.length){b.innerHTML='<div style="text-align:center;padding:24px;color:var(--muted2);font-size:.85rem">Nenhum item adicionado ainda.</div>';return;}
  b.innerHTML=itens.map(i=>`
    <div class="cd-item">
      <div style="flex:1">
        <div class="cdi-name">${esc(i.nome)}</div>
        <div class="cdi-price">R$ ${i.preco}</div>
      </div>
      <div class="cdi-ctrl">
        <button class="cdi-btn" onclick="alterarQtyDireto('${esc(i.nome+'__'+i.preco)}',-1)">−</button>
        <span class="cdi-qty">${i.qty}</span>
        <button class="cdi-btn" onclick="alterarQtyDireto('${esc(i.nome+'__'+i.preco)}',1)">+</button>
      </div>
    </div>`).join('');
}

function alterarQtyDireto(key, delta){
  if(!CARRINHO[key])return;
  CARRINHO[key].qty=Math.max(0,CARRINHO[key].qty+delta);
  if(CARRINHO[key].qty===0) delete CARRINHO[key];
  atualizarCarrinho();
}

function limparCarrinho(){ CARRINHO={}; atualizarCarrinho(); renderMenu(CARDAPIO,true); }

// ── CART DRAWER ───────────────────────────────────────
document.getElementById('cart-fab').addEventListener('click', abrirCarrinho);
document.getElementById('cart-overlay').addEventListener('click', fecharCarrinho);

function abrirCarrinho(){
  document.getElementById('cart-overlay').classList.add('open');
  document.getElementById('cart-drawer').classList.add('open');
  document.getElementById('success-panel').classList.remove('show');
  document.getElementById('cd-form').style.display='flex';
  verificarHorario();
}
function fecharCarrinho(){
  document.getElementById('cart-overlay').classList.remove('open');
  document.getElementById('cart-drawer').classList.remove('open');
}

function verificarHorario(){
  const warn=document.getElementById('loja-fechada-warn');
  const btn=document.getElementById('btn-confirmar');
  const h=CARDAPIO?.horarios;
  const fechada = h && !estaAberto(h);
  warn.style.display = fechada?'block':'none';
  btn.disabled = fechada;
}

function estaAberto(h){
  if(!h||!h.diasAtivos)return true;
  const diasPt=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const hoje=diasPt[new Date().getDay()];
  if(!h.diasAtivos.includes(hoje))return false;
  if(!h.abre||!h.fecha)return true;
  const agora=new Date();
  const mins=agora.getHours()*60+agora.getMinutes();
  const [ha,ma]=h.abre.split(':').map(Number);
  const [hf,mf]=h.fecha.split(':').map(Number);
  return mins>=ha*60+ma && mins<=hf*60+mf;
}

// ── CONFIRMAR PEDIDO ──────────────────────────────────
document.getElementById('btn-confirmar').addEventListener('click', async()=>{
  const ident=document.getElementById('cd-ident').value.trim();
  const obs  =document.getElementById('cd-obs').value.trim();
  const itens=Object.values(CARRINHO);
  if(!ident){
    document.getElementById('cd-ident').classList.add('error');
    document.getElementById('cd-ident').focus();return;
  }
  document.getElementById('cd-ident').classList.remove('error');
  if(!itens.length)return;

  const total=itens.reduce((s,i)=>s+i.precoNum*i.qty,0);
  const btn=document.getElementById('btn-confirmar');
  btn.textContent='Enviando…';btn.disabled=true;

  try{
    const r=await fetch(`${API}/pedido/enviar`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        slug: CARDAPIO.slug,
        identificacao: ident,
        obs,
        itens: itens.map(i=>({nome:i.nome, preco:i.preco, qty:i.qty})),
        total: total.toFixed(2),
      })
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Erro ao enviar pedido');
    PEDIDO_ID=d.pedidoId;
    WPP_TEL=d.telefone||CARDAPIO.telefone||'';
    mostrarSucesso(itens, ident, obs, total, WPP_TEL);
  }catch(e){
    btn.textContent='✅ Confirmar Pedido';btn.disabled=false;
    alert('Erro: '+e.message);
  }
});

function mostrarSucesso(itens, ident, obs, total, tel){
  document.getElementById('cd-form').style.display='none';
  const sp=document.getElementById('success-panel');sp.classList.add('show');

  // Monta mensagem WPP
  const loja=CARDAPIO.nomeLoja||'';
  let msg=`*Pedido - ${loja}*\n`;
  msg+=`*${ident}*\n\n`;
  itens.forEach(i=>msg+=`${i.qty}x ${i.nome} — R$ ${(i.precoNum*i.qty).toFixed(2)}\n`);
  if(obs)msg+=`\nObs: ${obs}\n`;
  msg+=`\n*Total: R$ ${total.toFixed(2)}*`;
  if(PEDIDO_ID) msg+=`\n_ID: ${PEDIDO_ID}_`;

  document.getElementById('btn-wpp').onclick=()=>{
    const telLimpo=(tel||'').replace(/\D/g,'');
    const url=telLimpo
      ?`https://wa.me/55${telLimpo}?text=${encodeURIComponent(msg)}`
      :`https://wa.me/?text=${encodeURIComponent(msg)}`;
    window.open(url,'_blank');
  };
}

function resetarPedido(){
  CARRINHO={};PEDIDO_ID=null;
  document.getElementById('cd-ident').value='';
  document.getElementById('cd-obs').value='';
  document.getElementById('cd-form').style.display='flex';
  document.getElementById('success-panel').classList.remove('show');
  atualizarCarrinho();renderMenu(CARDAPIO,true);fecharCarrinho();
}

// ── HORÁRIO ───────────────────────────────────────────
function renderHorario(h){
  const badge=document.getElementById('horario-badge');
  if(!h||!h.diasAtivos){badge.innerHTML='';return;}
  const aberto=estaAberto(h);
  badge.innerHTML=aberto
    ?`<div class="horario-badge hb-open"><div class="hb-dot"></div>Aberto agora · até ${h.fecha||''}</div>`
    :`<div class="horario-badge hb-closed"><div class="hb-dot"></div>${h.diasAtivos.includes(['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][new Date().getDay()])?`Fechado · abre às ${h.abre||''}`:'Fechado hoje'}</div>`;
}

// ── OBSERVER NAV ──────────────────────────────────────
function setupObserver(cats){
  if(!('IntersectionObserver' in window))return;
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        document.querySelectorAll('.cat-nav-btn').forEach(b=>{
          b.classList.toggle('active',b.dataset.target===entry.target.id);
        });
      }
    });
  },{rootMargin:'-20% 0px -70% 0px'});
  cats.forEach((_,i)=>{const el=document.getElementById(`sec-${i}`);if(el)obs.observe(el);});
}

function mostrarErro(msg){
  document.getElementById('loading').style.display='none';
  const e=document.getElementById('error-screen');e.style.display='flex';
  document.getElementById('err-msg').textContent=msg;
}
function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML;}
</script>
